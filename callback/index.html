<!doctype html>
<meta charset="utf-8">
<title>授权完成</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
 body{font:16px/1.7 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
      max-width:40em;margin:8vh auto;padding:0 1.2em;color:#222}
 h1{font-size:1.4em}
 .box{background:#f4f4f5;border:1px solid #ddd;border-radius:8px;padding:1em;
      word-break:break-all;font-family:ui-monospace,Menlo,Consolas,monospace;
      font-size:13px;margin:1em 0}
 button{font-size:16px;padding:.7em 1.4em;border-radius:8px;border:1px solid #888;
        background:#fff;cursor:pointer}
 button:active{background:#eee}
 .ok{color:#0a7d32;font-weight:600}
 .warn{color:#a33}
</style>
<h1>授权完成了</h1>
<p>下面这一整串就是要交回去的东西。点按钮复制，然后粘贴到终端里等着的那个提示后面。</p>
<div class="box" id="url"></div>
<p><button onclick="copy()">复制</button> <span id="msg"></span></p>
<p style="color:#666;font-size:14px">
复制完这个页面就可以关掉了。这串地址里包含一次性授权码，用过即失效，别发给别人。
</p>
<script>
 var full = location.href;
 document.getElementById('url').textContent = full;
 if (!location.search.includes('code=')) {
   document.getElementById('msg').innerHTML =
     '<span class="warn">注意：地址里没有 code= ，授权可能没成功。</span>';
 }
 function copy(){
   navigator.clipboard.writeText(full).then(function(){
     document.getElementById('msg').innerHTML = '<span class="ok">已复制</span>';
   }, function(){
     document.getElementById('msg').textContent = '复制失败，请手动全选上面那串。';
   });
 }
</script>
